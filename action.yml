name: doc-agent
description: AI 让文档随代码 PR 自动同步 —— 评估 → 计划 → 审批 → 写初稿 → 按评论返工。

inputs:
  mode:
    description: "plan | draft | revise"
    required: true
  ref:
    description: "要 checkout 的分支(revise 传 PR 的 head 分支;plan/draft 留空=默认分支)"
    required: false
    default: ""
  github-token:
    description: "用于开 Issue / PR、推 commit 的 token(一般传 github.token)"
    required: true
  llm-api-key:
    description: "大模型 API key(从 secret 传)"
    required: true
  llm-base-url:
    description: "OpenAI 兼容接口地址"
    required: false
    default: "https://open.bigmodel.cn/api/paas/v4"
  llm-model:
    required: false
    default: "glm-4.6"
  llm-fast-model:
    description: "翻译/译文质检用的更快模型(核心文档生成仍用 llm-model 保质量)"
    required: false
    default: "glm-4-flash"
  llm-retry-max-wait-ms:
    description: "单次模型调用遇到限流(429、智谱 1302/1303/1305)或 5xx 时,指数退避 + 随机抖动的累计等待上限(毫秒);再等就超限时如实失败回帖"
    required: false
    default: "180000"
  llm-max-tokens:
    description: "模型单次输出上限(max_tokens);留空 = 接口默认(整篇翻译与译文质检这两个长输出阶段例外,它们始终显式设上限,默认 4096)。输出被截断(finish_reason=length)时按「模型输出被截断」失败回帖,可调大此值"
    required: false
    default: ""
  llm-timeout-ms:
    description: "单次模型调用的客户端超时(毫秒)。默认 300000:glm-4.6 带思考时,大文档的一次调用实测到过约 210s,超时被中止会白跑一轮(那次拿不到用量,服务端却可能照样计费)"
    required: false
    default: "300000"
  translate-chunk-chars:
    description: "整篇翻译的分块大小(源文档字符数),按 Markdown 标题切块逐块翻译再拼接;默认 4000,配合 4096 的输出上限有余量"
    required: false
    default: "4000"
  # ── 路径与语言(默认 == 历史行为:代码 src、中文 docs/zh、英文 docs/en、*.md)──
  code-paths:
    description: "代码路径 glob,换行或逗号分隔;** 跨目录,! 或 :! 开头为排除(如 apollo-*/src/main/java 与 :!**/src/test/**)。只有这些文件的改动才触发文档评估"
    required: false
    default: "src"
  docs-source-dir:
    description: "源语言(canonical)文档目录;仓库根目录写 .。计划里的新建文档也只能落在这里"
    required: false
    default: "docs/zh"
  docs-target-dir:
    description: "译文镜像目录,与源文档同相对路径(如 docs/en;KWDB 式「根目录中文 → en/」写 en)。位于源目录之内时自动从源文档里排除"
    required: false
    default: "docs/en"
  docs-glob:
    description: "文档文件名通配,换行或逗号分隔(顺带滤掉图片);拼写/坏链检查也按它取文件"
    required: false
    default: "*.md"
  docs-exclude:
    description: "从源文档里排除的路径 glob,换行或逗号分隔(如 README.md, .github/**)"
    required: false
    default: ""
  source-lang:
    description: "源语言 zh | en(译文同步目前只支持 zh → en)"
    required: false
    default: "zh"
  plan-token-budget:
    description: "plan 阶段输入(提示词 + diff + 文档索引 + 文档全文)的估算 token 上限;文档按相关度在预算内取舍,固定部分就放不下时失败并在 PR 下回帖"
    required: false
    default: "60000"
  diff-token-budget:
    description: "代码 diff 的估算 token 上限(plan 与 draft 共用);超出时按文件截断并标注「已截断」"
    required: false
    default: "20000"

runs:
  using: composite
  steps:
    # checkout 调用方仓库(=目标仓库)的内容到工作区
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
    # 跑工具自带的脚本($GITHUB_ACTION_PATH 指向本 Action 仓库的检出目录)
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        LLM_API_KEY: ${{ inputs.llm-api-key }}
        LLM_BASE_URL: ${{ inputs.llm-base-url }}
        LLM_MODEL: ${{ inputs.llm-model }}
        LLM_FAST_MODEL: ${{ inputs.llm-fast-model }}
        LLM_RETRY_MAX_WAIT_MS: ${{ inputs.llm-retry-max-wait-ms }}
        LLM_MAX_TOKENS: ${{ inputs.llm-max-tokens }}
        LLM_TIMEOUT_MS: ${{ inputs.llm-timeout-ms }}
        TRANSLATE_CHUNK_CHARS: ${{ inputs.translate-chunk-chars }}
        CODE_PATHS: ${{ inputs.code-paths }}
        DOCS_SOURCE_DIR: ${{ inputs.docs-source-dir }}
        DOCS_TARGET_DIR: ${{ inputs.docs-target-dir }}
        DOCS_GLOB: ${{ inputs.docs-glob }}
        DOCS_EXCLUDE: ${{ inputs.docs-exclude }}
        SOURCE_LANG: ${{ inputs.source-lang }}
        PLAN_TOKEN_BUDGET: ${{ inputs.plan-token-budget }}
        DIFF_TOKEN_BUDGET: ${{ inputs.diff-token-budget }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        ISSUE_BODY: ${{ github.event.issue.body }}
        # pull_request_review 事件才有;有它 revise 就批量处理本 PR 全部待处理意见,没有(老的逐条评论事件)按单条处理
        REVIEW_ID: ${{ github.event.review.id }}
        COMMENT_ID: ${{ github.event.comment.id }}
        COMMENT_BODY: ${{ github.event.comment.body }}
        COMMENT_PATH: ${{ github.event.comment.path }}
        COMMENT_LINE: ${{ github.event.comment.line }}
      run: node "$GITHUB_ACTION_PATH/scripts/${{ inputs.mode }}.mjs"
